name: Windows Setup (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check project sources
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/CM.Gefaehrdungsbeurteilung/CM.Gefaehrdungsbeurteilung.csproj')) {
            throw 'Quellcode noch nicht hochgeladen: bitte zuerst den getesteten Stand 0.1.3 committen.'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup Installation fehlgeschlagen' }
      - name: Build Windows Setup
        shell: pwsh
        run: ./scripts/Build-Setup.ps1
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Setup fehlt' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "release/$($setup.Name).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: CM-Gefaehrdungsbeurteilung-unsigned-test-setup
          path: release/*
          if-no-files-found: error
          retention-days: 14
