name: Windows Setup (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate sources
        shell: pwsh
        run: |
          $required = @(
            'src/CM.Gefaehrdungsbeurteilung/CM.Gefaehrdungsbeurteilung.csproj',
            'scripts/Build-Setup.ps1',
            'installer/Setup.iss'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required source missing: $file" }
          }
      - name: Verify PowerShell build scripts parse
        shell: pwsh
        run: |
          $scripts = @('scripts/Build-Setup.ps1', 'scripts/Test-VersionConsistency.ps1', 'scripts/Prepare-SignedRelease.ps1', 'scripts/Publish-SignedRelease.ps1')
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $path : $($errors -join '; ')" }
          }
      - name: Validate catalog, XAML and SQLite migrations
        shell: pwsh
        run: python tests/Validate-Source.py
      - name: Verify version consistency
        shell: pwsh
        run: ./scripts/Test-VersionConsistency.ps1
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installation' }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
      - name: Build unsigned Windows Setup
        shell: pwsh
        run: ./scripts/Build-Setup.ps1 -ISCC "$env:ISCC_PATH"
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one setup EXE, found $($setups.Count)" }
          $setup = $setups[0]
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "release/$($setup.Name).sha256"
      - name: Upload unsigned test setup
        uses: actions/upload-artifact@v4
        with:
          name: CM-Gefaehrdungsbeurteilung-unsigned-test-setup
          path: release/*
          if-no-files-found: error
          retention-days: 14
